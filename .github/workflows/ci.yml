name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: backend (go vet + test sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Go vet
        run: go vet ./...
      - name: Go test (sqlite, no cgo needed)
        run: go test ./... -count=1 -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -20

  frontend:
    name: frontend (pnpm lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

  docker:
    name: docker build (backend + frontend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Cache Go mods
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
      - name: Build backend (test stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build backend (final)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: expense-tracker-backend:ci
          cache-from: type=gha
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: expense-tracker-frontend:ci
          cache-from: type=gha
      - name: Create .env for CI (if missing)
        run: |
          if [ ! -f .env ]; then
            cat > .env <<'EOF'
          POSTGRES_DB=expense-tracker
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          DATABASE_URL=host=postgres user=postgres password=postgres dbname=expense-tracker port=5432 sslmode=disable TimeZone=UTC
          PORT=8080
          EOF
            cat .env
          fi
      - name: Smoke test compose
        run: |
          docker compose up -d --build
          for i in 1 2 3 4 5 6; do
            if curl -sf http://localhost:8080/health | grep -q ok; then echo "backend healthy"; break; fi
            echo "waiting backend $i..."; sleep 5
          done
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:5173/ | head -20
          docker compose ps
          docker compose down

  ghcr:
    name: push to GHCR (main only)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and push backend to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and push frontend to GHCR
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
