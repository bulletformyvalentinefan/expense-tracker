services:
  postgres:
    image: postgres:16
    container_name: expense-tracker-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-3120}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-expense-tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/bulletformyvalentinefan/expense-tracker-backend:latest
    container_name: expense-tracker-backend
    restart: always
    pull_policy: always
    ports:
      - "${BACKEND_PORT:-3110}:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-host=postgres user=postgres password=postgres dbname=expense-tracker port=5432 sslmode=disable TimeZone=UTC}
      POSTGRES_DB: ${POSTGRES_DB:-expense-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/bulletformyvalentinefan/expense-tracker-frontend:latest
    container_name: expense-tracker-frontend
    restart: always
    pull_policy: always
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
