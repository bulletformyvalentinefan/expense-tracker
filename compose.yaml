services:
  postgres:
    image: postgres:16
    container_name: expense-tracker-db
    restart: always
    environment:
      POSTGRES_DB: expense-tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense-tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-tracker-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=postgres user=postgres password=${POSTGRES_PASSWORD} dbname=expense-tracker port=5432 sslmode=disable TimeZone=UTC"
      # legacy fallback
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expense-tracker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-tracker-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
